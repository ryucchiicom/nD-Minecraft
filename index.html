<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17231c">
<title>nD Minecraft</title>
<style>
:root{--bg:#101713;--panel:#1c2921;--panel2:#26372c;--line:#49604e;--green:#75c66b;--text:#f2f5ec;--muted:#aebcaf;--gold:#f4d36e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none}
button{font:inherit;color:inherit;border:1px solid #6a806c;background:linear-gradient(#344b39,#25382c);border-radius:10px;padding:10px 14px;box-shadow:0 3px 0 #142118;cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #142118}
#app{height:100%;display:flex;flex-direction:column;max-width:1500px;margin:0 auto;background:#152019}
#topbar{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:#111a14;border-bottom:1px solid #34483a;z-index:5}
.logo{font-weight:900;letter-spacing:.09em;font-size:16px}.logo span{color:var(--green)}
.top-actions{display:flex;align-items:center;gap:8px}.top-actions button{padding:6px 10px;font-size:12px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:auto}
.hidden{display:none!important}
#menu{background:radial-gradient(ellipse at 50% 35%,#314936 0,#1a2a20 45%,#101713 100%)}
.menu-title{font-size:clamp(32px,8vw,62px);font-weight:1000;letter-spacing:.035em;text-shadow:0 5px 0 #122016,0 8px 24px #0008;margin:0 0 4px}
.menu-sub{color:#c4d3c2;font-size:13px;letter-spacing:.13em;margin-bottom:26px}
.picker-label{font-size:12px;color:#b9c8b8;margin-bottom:10px;letter-spacing:.12em}
#wheel{width:min(360px,88vw);height:218px;position:relative;overflow:hidden;border-top:1px solid #59705c;border-bottom:1px solid #59705c;background:linear-gradient(90deg,#17231b,#28372c 50%,#17231b);border-radius:12px;touch-action:none;}
#wheel:before{content:"";position:absolute;left:0;right:0;top:50%;height:68px;transform:translateY(-50%);background:#ffffff12;border-top:1px solid #91aa8e66;border-bottom:1px solid #91aa8e66;pointer-events:none;z-index:1}
.wheel-number{position:absolute;left:0;width:100%;height:58px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:300;color:#d3ddd0;transition:top .16s ease,opacity .16s ease,transform .16s ease;cursor:pointer}
.wheel-number.selected{font-size:66px;font-weight:500;color:white;z-index:2;text-shadow:0 2px 10px #fff4;transform:scale(1.02)}
.wheel-number:not(.selected){opacity:.35}
.wheel-hint{font-size:12px;color:#99aa99;margin:12px 0 22px}
#startBtn{min-width:220px;font-weight:800;letter-spacing:.05em;padding:13px 22px;background:linear-gradient(#79c76c,#4b8f48);border-color:#a2d69b;color:#102014;box-shadow:0 4px 0 #28502a}
.menu-note{max-width:440px;text-align:center;font-size:11px;line-height:1.8;color:#91a392;margin-top:24px}
#game{position:relative;display:flex;flex:1;min-height:0;flex-direction:column;padding:0;overflow:hidden;background:#8fc8ed}
#gamebar{height:45px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#17231b;border-bottom:1px solid #405544;z-index:4;gap:8px}
#dimensionLabel{font-weight:800;font-size:13px;white-space:nowrap}#dimensionLabel small{color:#a8b8a7;font-weight:500;margin-left:5px}
#status{font-size:11px;color:#d1ddce;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#backBtn{font-size:11px;padding:5px 9px;white-space:nowrap}
#viewport{position:relative;flex:1;min-height:0;overflow:hidden;background:#90c9ef}
#gameCanvas,#threeHost{position:absolute;inset:0;width:100%;height:100%;display:block}
#gameCanvas{touch-action:none}#threeHost{display:none;touch-action:none}#threeHost canvas{display:block;width:100%;height:100%}
#crosshair{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none;z-index:2;opacity:.9}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#crosshair:before{width:2px;height:18px;left:8px;top:0}#crosshair:after{height:2px;width:18px;left:0;top:8px}
#hotbar{height:66px;flex:none;background:#18241c;border-top:1px solid #536b54;display:flex;align-items:center;justify-content:center;gap:7px;padding:6px 8px;z-index:4}
.slot{width:54px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#24352a;border:2px solid #576b58;border-radius:6px;position:relative;cursor:pointer}
.slot.active{border-color:#fff;background:#344b37;box-shadow:0 0 0 1px #fff7 inset}
.slot .swatch{width:22px;height:22px;border:1px solid #ffffff66;image-rendering:pixelated}
.slot .count{position:absolute;right:3px;bottom:0;font-size:10px;text-shadow:1px 1px #000;font-weight:700}.slot small{font-size:9px;color:#d9e4d5}
.touch-ui{position:absolute;inset:0;pointer-events:none;z-index:3}
#movePad{position:absolute;left:16px;bottom:16px;width:126px;height:126px;border-radius:50%;border:2px solid #ffffff6b;background:#14201955;pointer-events:auto;touch-action:none;display:none}
#moveKnob{position:absolute;left:37px;top:37px;width:48px;height:48px;border-radius:50%;background:#e9f2e7aa;border:2px solid #fff;box-shadow:0 2px 8px #0007}
.touch-btns{position:absolute;right:14px;bottom:17px;display:none;gap:9px;align-items:flex-end;pointer-events:auto}
.touch-btns .col{display:flex;flex-direction:column;gap:8px;align-items:center}
.touch-btns button{width:58px;height:54px;padding:3px;font-size:11px;font-weight:800;background:#1e2c24c9;border-color:#ffffff9c;backdrop-filter:blur(4px)}
.touch-btns button.primary{background:#d0e8c6dd;color:#1a2d1c;border-color:#fff}
#simpleControls{display:none;flex:none;height:78px;align-items:center;justify-content:center;gap:12px;background:#17231b;border-top:1px solid #3d5340;z-index:4}
#simpleControls button{min-width:62px;height:54px;padding:5px 10px;font-weight:800}#simpleControls .action{min-width:86px}
#wAxis{position:absolute;right:10px;top:10px;width:min(300px,52%);padding:8px 10px;background:#17231bc9;border:1px solid #d8e9d266;border-radius:10px;z-index:4;display:none;backdrop-filter:blur(5px)}
#wAxisHead{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:800;margin-bottom:5px}#wValue{color:#b8ed9b;font-variant-numeric:tabular-nums}
#wSlider{width:100%;accent-color:#91d47c;height:18px;touch-action:pan-x}
#wButtons{display:flex;justify-content:space-between;gap:6px;margin-top:3px}#wButtons button{font-size:10px;padding:4px 10px;min-width:54px}
#toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:#17231bd9;border:1px solid #ffffff55;padding:7px 12px;border-radius:8px;font-size:12px;z-index:7;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#footerHint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:5px 9px;background:#17231b99;border-radius:6px;color:#fff;font-size:10px;z-index:2;pointer-events:none;white-space:nowrap}
@media(min-width:850px){#movePad{width:140px;height:140px;left:24px;bottom:22px}#moveKnob{left:43px;top:43px}.touch-btns{right:24px;bottom:24px}.touch-btns button{width:64px;height:58px}}
@media(max-width:520px){#topbar{height:48px;padding:0 10px}.logo{font-size:14px}#gamebar{height:40px}#hotbar{height:61px;gap:4px}.slot{width:48px;height:48px}.screen{padding:16px}.menu-sub{margin-bottom:18px}#status{font-size:10px}#simpleControls{gap:6px;padding:0 6px}#simpleControls button{min-width:48px;height:48px;padding:4px 7px}#simpleControls .action{min-width:64px}}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="logo">nD <span>MINECRAFT</span></div>
    <div class="top-actions"><button id="helpBtn" type="button">操作方法</button></div>
  </header>
  <section id="menu" class="screen">
    <h1 class="menu-title">nD MINECRAFT</h1>
    <div class="menu-sub">THE WORLD HAS MORE THAN THREE DIMENSIONS.</div>
    <div class="picker-label">次元を選択</div>
    <div id="wheel" aria-label="次元選択"></div>
    <div class="wheel-hint">上下にスワイプして次元を変更</div>
    <button id="startBtn" type="button">3D で開始</button>
    <div class="menu-note">1D：一本の直線　/　2D：平面　/　3D：通常の3D世界　/　4D：W軸で世界そのものが変化</div>
  </section>
  <section id="game" class="hidden">
    <div id="gamebar">
      <div id="dimensionLabel">3D <small>通常のMinecraft</small></div>
      <div id="status">探索中</div>
      <button id="backBtn" type="button">次元選択へ</button>
    </div>
    <div id="viewport">
      <canvas id="gameCanvas"></canvas>
      <div id="threeHost"></div>
      <div id="crosshair"></div>
      <div id="toast"></div>
      <div id="wAxis">
        <div id="wAxisHead"><span>第4軸 / W</span><span id="wValue">W = 0.00</span></div>
        <input id="wSlider" type="range" min="-10" max="10" step="0.01" value="0" aria-label="W軸移動">
        <div id="wButtons"><button id="wMinus" type="button">W −</button><span style="font-size:10px;color:#b8c6b6;align-self:center">長押しで連続移動</span><button id="wPlus" type="button">W ＋</button></div>
      </div>
      <div id="movePad"><div id="moveKnob"></div></div>
      <div class="touch-ui"><div class="touch-btns" id="touch3d">
        <div class="col"><button id="mine3d">掘る</button><button id="place3d">置く</button></div>
        <div class="col"><button class="primary" id="jump3d">ジャンプ</button></div>
      </div></div>
      <div id="footerHint"></div>
    </div>
    <div id="hotbar"></div>
    <div id="simpleControls">
      <button id="leftBtn" aria-label="左へ">◀</button>
      <button id="rightBtn" aria-label="右へ">▶</button>
      <button class="action" id="mineBtn">掘る</button>
      <button class="action" id="placeBtn">置く</button>
      <button id="jumpBtn">ジャンプ</button>
    </div>
  </section>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const menu=$('menu'),game=$('game'),wheel=$('wheel'),startBtn=$('startBtn');
const canvas=$('gameCanvas'),ctx=canvas.getContext('2d'),viewport=$('viewport');
const host=$('threeHost'),movePad=$('movePad'),moveKnob=$('moveKnob');
let selectedN=3,dimension=3,mode='menu',raf=0,lastTime=0,toastTimer=0;
let THREE=null,threeLoading=false,threeFailed=false,waitingForStart=false;
const blockTypes=[
 {id:'grass',name:'草',color:'#65a94d',dark:'#41763b'},
 {id:'dirt',name:'土',color:'#96633d',dark:'#65402a'},
 {id:'stone',name:'石',color:'#89918f',dark:'#59615f'},
 {id:'wood',name:'木',color:'#96663c',dark:'#634326'},
 {id:'sand',name:'砂',color:'#d8c27a',dark:'#a18d52'}
];
let selectedBlock=0,inventory={grass:24,dirt:20,stone:12,wood:8,sand:8};
let keys={},moveInput={x:0,z:0},jumpQueued=false,wHeld=0;
let oneD=null,twoD=null,threeD=null;
function showToast(s){const el=$('toast');el.textContent=s;el.style.opacity='1';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.opacity='0',1500)}
function renderWheel(){
 wheel.innerHTML='';
 for(let n=Math.max(1,selectedN-1);n<=Math.min(4,selectedN+1);n++){
  const el=document.createElement('div');el.className='wheel-number'+(n===selectedN?' selected':'');
  el.textContent=n;el.style.top=`calc(50% - 29px + ${(n-selectedN)*67}px)`;
  el.addEventListener('click',()=>{selectedN=n;renderWheel()});wheel.appendChild(el);
 }
 startBtn.textContent=`${selectedN}D で開始`;
}
let wheelY=null;
wheel.addEventListener('pointerdown',e=>{wheelY=e.clientY});
wheel.addEventListener('pointerup',e=>{if(wheelY===null)return;const d=e.clientY-wheelY;wheelY=null;if(Math.abs(d)>18){selectedN=Math.max(1,Math.min(4,selectedN+(d<0?1:-1)));renderWheel()}});
wheel.addEventListener('wheel',e=>{e.preventDefault();selectedN=Math.max(1,Math.min(4,selectedN+(e.deltaY>0?1:-1)));renderWheel()},{passive:false});
document.addEventListener('keydown',e=>{if(mode==='menu'&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();selectedN=Math.max(1,Math.min(4,selectedN+(e.key==='ArrowDown'?1:-1)));renderWheel()}});
renderWheel();

function setScreen(which){menu.classList.toggle('hidden',which!=='menu');game.classList.toggle('hidden',which!=='game');mode=which;if(which==='menu'){stopLoop();disposeThree();}}
function stopLoop(){if(raf)cancelAnimationFrame(raf);raf=0;lastTime=0}
function clearGame(){stopLoop();disposeThree();oneD=null;twoD=null;threeD=null;keys={};moveInput={x:0,z:0};wHeld=0;movePad.style.display='none';$('touch3d').style.display='none';$('simpleControls').style.display='none';$('wAxis').style.display='none';$('crosshair').style.display='none';$('footerHint').textContent='';host.style.display='none';canvas.style.display='block';}
function startGame(){
 dimension=selectedN;
 if((dimension===3||dimension===4)&&!THREE){
  if(threeFailed){showToast('3Dエンジンを読み込めなかったよ。通信環境を確認してね');return;}
  waitingForStart=true;startBtn.disabled=true;startBtn.textContent='3Dエンジンを読み込み中…';return;
 }
 clearGame();inventory={grass:24,dirt:20,stone:12,wood:8,sand:8};selectedBlock=0;
 $('dimensionLabel').innerHTML=`${dimension}D <small>${dimension===1?'一本の直線':dimension===2?'横視点の平面':dimension===3?'通常の3D世界':'W軸で変化する4D世界'}</small>`;
 canvas.style.display='block';host.style.display='none';$('crosshair').style.display='none';
 if(dimension===1){init1D();$('simpleControls').style.display='flex';$('jumpBtn').classList.add('hidden');$('status').textContent='X軸だけの世界';$('footerHint').textContent='A / D または ◀ ▶ で移動';}
 if(dimension===2){init2D();$('simpleControls').style.display='flex';$('jumpBtn').classList.remove('hidden');$('status').textContent='平面を探索中';$('footerHint').textContent='A / D：移動　Space：ジャンプ　タップ：ブロックを選択';}
 if(dimension===3||dimension===4){init3D();canvas.style.display='none';host.style.display='block';$('crosshair').style.display='block';movePad.style.display='block';$('touch3d').style.display='flex';$('simpleControls').style.display='none';$('status').textContent='WASDで移動';$('footerHint').textContent='WASD：移動 / マウス：視点・左クリックで掘る / F：掘る G：置く / Space：ジャンプ';if(dimension===4){$('wAxis').style.display='block';$('footerHint').textContent='WASD：移動 / Space：ジャンプ / W軸スライダー or 長押し / F：掘る G：置く';}}
 renderHotbar();setScreen('game');resizeCanvas();raf=requestAnimationFrame(loop);
}
startBtn.addEventListener('click',startGame);
$('backBtn').addEventListener('click',()=>{clearGame();setScreen('menu');renderWheel()});
$('helpBtn').addEventListener('click',()=>{
 const msg='【1D】左右に移動。前のブロックを掘って道を作り、空きマスに置く。ジャンプはなし。\n【2D】A/Dまたは左右で移動、Spaceでジャンプ。画面タップで狙ったブロックを掘る/置く。\n【3D】WASDまたは左スティックで移動、マウス/画面右側ドラッグで視点変更、Spaceでジャンプ。中央の照準でF/掘るボタン、G/置くボタン。\n【4D】3D操作に加えてWスライダーまたはW−/W＋長押しで第4軸を移動。地形が連続的に変形する。\nブロックは下のホットバーで選択。';
 alert(msg);
});

function renderHotbar(){
 const bar=$('hotbar');bar.innerHTML='';
 blockTypes.forEach((b,i)=>{const s=document.createElement('div');s.className='slot'+(i===selectedBlock?' active':'');s.innerHTML=`<div class="swatch" style="background:${b.color}"></div><small>${b.name}</small><span class="count">${inventory[b.id]||0}</span>`;s.addEventListener('click',()=>{selectedBlock=i;renderHotbar()});bar.appendChild(s)});
}
function adjustInv(id,amount){inventory[id]=Math.max(0,(inventory[id]||0)+amount);renderHotbar()}
function rand2(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}

// ---------- 1D: one endless line ----------
function init1D(){
 oneD={x:0,dir:1,world:new Map(),lastStep:0};
 for(let x=-120;x<=120;x++){
  let r=rand2(x+901);
  let t=r<.13?null:r<.48?'grass':r<.72?'dirt':r<.9?'stone':r<.96?'wood':'sand';
  oneD.world.set(x,t);
 }
 oneD.world.set(-1,null);oneD.world.set(0,null);oneD.world.set(1,'grass');
 $('leftBtn').textContent='◀';$('rightBtn').textContent='▶';
}
function get1D(x){if(!oneD.world.has(x)){let r=rand2(x+901);oneD.world.set(x,r<.13?null:r<.48?'grass':r<.72?'dirt':r<.9?'stone':r<.96?'wood':'sand')}return oneD.world.get(x)}
function move1D(dir){let next=oneD.x+dir;if(get1D(next)===null){oneD.x=next;oneD.dir=dir;updateStatus1D()}else{showToast('前にブロックがあるよ。先に掘ろう！')}}
function target1D(){return oneD.x+oneD.dir}
function mine1D(){let x=target1D(),t=get1D(x);if(!t){showToast('そこにはブロックがないよ');return}oneD.world.set(x,null);adjustInv(t,1);showToast('ブロックを掘った！');updateStatus1D()}
function place1D(){let x=target1D();if(get1D(x)!==null){showToast('そこには置けないよ');return}let b=blockTypes[selectedBlock].id;if((inventory[b]||0)<=0){showToast('そのブロックを持っていないよ');return}oneD.world.set(x,b);adjustInv(b,-1);updateStatus1D()}
function updateStatus1D(){$('status').textContent=`X ${oneD.x}　｜　進行方向 ${oneD.dir>0?'→':'←'}`}
function draw1D(w,h){
 ctx.fillStyle='#17202a';ctx.fillRect(0,0,w,h);
 ctx.fillStyle='#202f38';ctx.fillRect(0,h*.56,w,h*.44);
 const cell=Math.min(72,Math.max(48,w/8));const center=w/2;const midY=h*.55;
 ctx.strokeStyle='#9db8b2';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,midY+cell*.44);ctx.lineTo(w,midY+cell*.44);ctx.stroke();
 for(let dx=-Math.ceil(w/cell/2)-1;dx<=Math.ceil(w/cell/2)+1;dx++){
  const wx=oneD.x+dx,sx=center+dx*cell-cell/2,t=get1D(wx);
  if(t){const def=blockTypes.find(a=>a.id===t);ctx.fillStyle=def.color;ctx.fillRect(sx,midY-cell*.48,cell-2,cell*.9);ctx.fillStyle=def.dark;ctx.fillRect(sx,midY+cell*.22,cell-2,cell*.2);ctx.strokeStyle='#202b24';ctx.lineWidth=2;ctx.strokeRect(sx,midY-cell*.48,cell-2,cell*.9);ctx.fillStyle='#ffffff22';ctx.fillRect(sx+5,midY-cell*.42,cell-12,5);}
  else{ctx.fillStyle='#ffffff09';ctx.fillRect(sx,midY-cell*.48,cell-2,cell*.9);ctx.strokeStyle='#ffffff22';ctx.strokeRect(sx,midY-cell*.48,cell-2,cell*.9)}
  ctx.fillStyle='#dbe8dc';ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillText(String(wx),sx+cell/2-1,midY+cell*.67);
 }
 // The marker is a position on the line, not a second spatial axis.
 ctx.fillStyle='#f3d76a';ctx.beginPath();ctx.arc(center,midY-cell*.13,Math.min(17,cell*.23),0,Math.PI*2);ctx.fill();ctx.strokeStyle='#42361a';ctx.lineWidth=3;ctx.stroke();
 ctx.fillStyle='#17231b';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('YOU',center,midY-cell*.1+4);
 ctx.fillStyle='#dce7df';ctx.font='13px system-ui';ctx.fillText('←  X 軸  →',center,midY-cell*.8);
}

// ---------- 2D: side-view voxel platform world ----------
const TILE=32,WW=240,WH=42;
function init2D(){
 twoD={map:Array.from({length:WH},()=>Array(WW).fill(null)),x:8*TILE,y:0,vx:0,vy:0,ground:false,face:1,camX:0,camY:0,pointer:{x:0,y:0,valid:false}};
 for(let x=0;x<WW;x++){
  const surface=Math.max(12,Math.min(30,Math.round(22+Math.sin(x*.075)*3+Math.cos(x*.027)*4+(rand2(x+77)-.5)*2)));
  for(let y=surface;y<WH;y++){
   let t='stone';if(y===surface)t='grass';else if(y<surface+4)t='dirt';else if(rand2(x*93+y*71)<.035)t='stone';
   if(y>surface+5&&rand2(x*17+y*97)<.018)t='sand';twoD.map[y][x]=t;
  }
 }
 // Small trees and exposed patches make the 2D slice feel like a Minecraft landscape.
 for(let x=12;x<WW-5;x+=13){if(rand2(x*8)>.35){let sy=findSurface(x);for(let j=1;j<=3;j++)put2D(x,sy-j,'wood');for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=0;dy++)if(Math.abs(dx)+Math.abs(dy)<4&&!twoD.map[sy+dy-3]?.[x+dx])put2D(x+dx,sy+dy-3,'grass');}}
 const sx=8;twoD.y=(findSurface(sx)-2)*TILE;
 $('leftBtn').textContent='◀';$('rightBtn').textContent='▶';
}
function findSurface(x){for(let y=0;y<WH;y++)if(twoD.map[y][x])return y;return WH-1}
function put2D(x,y,t){if(x>=0&&x<WW&&y>=0&&y<WH)twoD.map[y][x]=t}
function get2D(x,y){if(x<0||x>=WW||y>=WH)return 'stone';if(y<0)return null;return twoD.map[y][x]}
function solid2D(x,y){return !!get2D(Math.floor(x/TILE),Math.floor(y/TILE))}
function collide2D(nx,ny){const pw=19,ph=48;let left=nx-pw/2,right=nx+pw/2,top=ny-ph,bottom=ny-2;return solid2D(left,top)||solid2D(right,top)||solid2D(left,bottom)||solid2D(right,bottom)||solid2D(left,(top+bottom)/2)||solid2D(right,(top+bottom)/2)}
function update2D(dt){
 const p=twoD;let ax=0;if(keys.ArrowLeft||keys.KeyA||keys.TouchLeft)ax--;if(keys.ArrowRight||keys.KeyD||keys.TouchRight)ax++;
 p.vx=ax*180;if(ax)p.face=ax;
 const jump=jumpQueued||(keys.Space&&p.ground);if(jump&&p.ground){p.vy=-390;p.ground=false;}jumpQueued=false;
 let nx=p.x+p.vx*dt;if(!collide2D(nx,p.y))p.x=Math.max(14,Math.min((WW-2)*TILE,nx));else p.vx=0;
 p.vy=Math.min(620,p.vy+900*dt);let ny=p.y+p.vy*dt;
 if(!collide2D(p.x,ny)){p.y=ny;p.ground=false;}else{if(p.vy>0){p.ground=true;let ty=Math.floor((ny-2)/TILE);p.y=ty*TILE+2;}p.vy=0;}
 p.camX=Math.max(0,Math.min(WW*TILE-canvas.clientWidth,p.x-canvas.clientWidth*.48));
 p.camY=Math.max(0,Math.min(WH*TILE-canvas.clientHeight,p.y-canvas.clientHeight*.55));
}
function drawBlock2D(x,y,t){const b=blockTypes.find(v=>v.id===t)||blockTypes[2],sx=x*TILE-twoD.camX,sy=y*TILE-twoD.camY;
 ctx.fillStyle=b.color;ctx.fillRect(sx,sy,TILE,TILE);ctx.fillStyle=b.dark;ctx.fillRect(sx,sy+TILE-6,TILE,6);ctx.strokeStyle='#18251c88';ctx.lineWidth=1;ctx.strokeRect(sx+.5,sy+.5,TILE-1,TILE-1);
 ctx.fillStyle='#ffffff17';ctx.fillRect(sx+3,sy+3,TILE-6,3);
}
function draw2D(w,h){
 const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#63b5eb');g.addColorStop(1,'#d4efff');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 ctx.fillStyle='#fff2a6';ctx.beginPath();ctx.arc(w*.78,h*.18,27,0,Math.PI*2);ctx.fill();
 const minX=Math.max(0,Math.floor(twoD.camX/TILE)-1),maxX=Math.min(WW-1,Math.ceil((twoD.camX+w)/TILE)+1);
 const minY=Math.max(0,Math.floor(twoD.camY/TILE)-1),maxY=Math.min(WH-1,Math.ceil((twoD.camY+h)/TILE)+1);
 for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++){let t=twoD.map[y][x];if(t)drawBlock2D(x,y,t)}
 // simple distant cloud silhouettes
 ctx.fillStyle='#ffffff8a';for(let i=0;i<4;i++){let x=((i*230-twoD.camX*.22)%(w+200)+w+200)%(w+200)-80;let y=70+(i%2)*38;ctx.beginPath();ctx.arc(x,y,17,0,7);ctx.arc(x+20,y-6,22,0,7);ctx.arc(x+43,y,15,0,7);ctx.fill()}
 // player
 const px=twoD.x-twoD.camX,py=twoD.y-twoD.camY;ctx.fillStyle='#2874b9';ctx.fillRect(px-10,py-46,20,42);ctx.fillStyle='#efbd91';ctx.fillRect(px-10,py-62,20,18);ctx.fillStyle='#443329';ctx.fillRect(px-10,py-65,20,7);ctx.fillStyle='#202a31';ctx.fillRect(px+(twoD.face>0?3:-6),py-55,4,4);ctx.fillStyle='#273d66';ctx.fillRect(px-10,py-7,8,7);ctx.fillRect(px+2,py-7,8,7);
 if(twoD.pointer.valid){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(twoD.pointer.x-16,twoD.pointer.y-16,32,32)}
}
function worldCellFromPointer(e){const r=canvas.getBoundingClientRect();const sx=e.clientX-r.left,sy=e.clientY-r.top;return{x:Math.floor((sx+twoD.camX)/TILE),y:Math.floor((sy+twoD.camY)/TILE),sx,sy}}
function mine2DAt(x,y){let t=get2D(x,y);if(!t){showToast('そこにはブロックがないよ');return}if(Math.hypot((x+.5)*TILE-twoD.x,(y+.5)*TILE-(twoD.y-25))>TILE*6){showToast('少し遠いよ');return}put2D(x,y,null);adjustInv(t,1)}
function place2DAt(x,y){const t=blockTypes[selectedBlock].id;if(get2D(x,y)!==null){showToast('そこには置けないよ');return}if((inventory[t]||0)<=0){showToast('そのブロックを持っていないよ');return}if(Math.hypot((x+.5)*TILE-twoD.x,(y+.5)*TILE-(twoD.y-25))>TILE*5){showToast('少し遠いよ');return}put2D(x,y,t);adjustInv(t,-1)}
function target2D(){return{x:Math.floor((twoD.x+twoD.face*TILE*.95)/TILE),y:Math.floor((twoD.y-25)/TILE)}}
function mine2D(){let t=target2D();mine2DAt(t.x,t.y)}function place2D(){let t=target2D();place2DAt(t.x,t.y)}

// ---------- 3D / 4D: voxel world and continuous W-slice ----------
const matColors={grass:0x65a94d,dirt:0x96633d,stone:0x89918f,wood:0x96663c,sand:0xd8c27a};
function loadThree(){if(threeLoading||THREE||threeFailed)return;threeLoading=true;import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js').then(m=>{THREE=m;threeLoading=false;startBtn.disabled=false;renderWheel();if(waitingForStart){waitingForStart=false;startGame();}}).catch(err=>{threeLoading=false;threeFailed=true;waitingForStart=false;startBtn.disabled=false;startBtn.textContent='3D読み込み失敗';console.error(err);})}
loadThree();
function makeMat(color){return new THREE.MeshStandardMaterial({color,roughness:1,metalness:0})}
function init3D(){
 const is4=dimension===4;
 if(!THREE){loadThree();return}
 const scene=new THREE.Scene();scene.background=new THREE.Color(is4?0x668fb0:0x8fc9ef);scene.fog=new THREE.Fog(is4?0x668fb0:0x8fc9ef,15,29);
 const camera=new THREE.PerspectiveCamera(75,viewport.clientWidth/Math.max(1,viewport.clientHeight),.1,100);
 const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));renderer.setSize(viewport.clientWidth,viewport.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;host.innerHTML='';host.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xffffff,0x53604b,2.05));const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(-8,16,9);scene.add(sun);
 const cubeGeo=new THREE.BoxGeometry(1,1,1);const materials={};for(const b of blockTypes)materials[b.id]=makeMat(matColors[b.id]);
 const blocks=new Map(),terrain=[];const decorative=[];
 const player={x:0,y:0,z:0,vy:0,ground:true,yaw:0,pitch:-.08};
 let w=0,lastW=NaN,treeSpots=[];
 const blockKey=(x,y,z)=>`${x},${y},${z}`;
 function addBlock(x,y,z,type,opts={}){
  const mesh=new THREE.Mesh(cubeGeo,materials[type]||materials.stone);mesh.position.set(x,y,z);mesh.castShadow=false;mesh.receiveShadow=true;
  mesh.userData.block={x,y,z,type,terrain:!!opts.terrain,top:!!opts.top};scene.add(mesh);blocks.set(blockKey(x,y,z),mesh);return mesh;
 }
 function heightAt(x,z,ww=w){
  if(is4)return 3.35+1.25*Math.sin(x*.34+ww*.9)+1.0*Math.cos(z*.32-ww*.68)+.55*Math.sin((x+z)*.19+ww*1.25);
  return 3+Math.round(Math.sin(x*.32)*1.05+Math.cos(z*.29)*.85+Math.sin((x-z)*.15)*.4);
 }
 function topTypeAt(x,z,ww=w){if(!is4)return 'grass';const v=Math.sin(x*.2+z*.11+ww*.72);return v>.47?'sand':v<-.5?'stone':'grass'}
 function buildWorld(){
  for(let x=-9;x<=9;x++)for(let z=-9;z<=9;z++){
   const h=heightAt(x,z,0);
   if(is4){
    const baseH=Math.round(h), meshes=[];
    for(let y=-3;y<=baseH;y++){let type=y===baseH?topTypeAt(x,z,0):y<baseH-3?'stone':'dirt';const m=addBlock(x,y+.5,z,type,{terrain:true,top:y===baseH});m.userData.baseY=m.position.y;meshes.push(m);}
    terrain.push({x,z,h0:h,baseH,meshes,top:meshes[meshes.length-1]});
   }else{
    for(let y=-3;y<Math.ceil(h);y++){let type=y>=h-1?'grass':y>=h-3?'dirt':'stone';if(y<h-3&&rand2(x*91+z*123+y*77)>.987)type='sand';addBlock(x,y+.5,z,type,{terrain:true})}
   }
  }
  // Trees are small clusters of actual voxel blocks in the ordinary 3D world.
  if(!is4)for(let x=-8;x<=8;x++)for(let z=-8;z<=8;z++){
   if(rand2(x*57+z*101+9)>.986){const y=Math.ceil(heightAt(x,z,0));if(y<2)continue;treeSpots.push({x,z,y});for(let k=0;k<3;k++)addBlock(x,y+k+.5,z,'wood');for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)for(let dy=2;dy<=3;dy++)if(Math.abs(dx)+Math.abs(dz)+(dy===3?1:0)<4)addBlock(x+dx,y+dy+.5,z+dz,'grass');}
  }
 }
 buildWorld();player.y=(is4?(Math.round(heightAt(0,0,0))+1):heightAt(0,0,0))+.03;camera.position.set(player.x,player.y+1.58,player.z);camera.rotation.order='YXZ';
 const raycaster=new THREE.Raycaster();raycaster.far=6;
 function updateTerrainW(){
  if(!is4||Math.abs(w-lastW)<.001)return;
  // A 4D world is rendered as a 3D slice. Moving W smoothly translates each
  // voxel column by a deterministic trigonometric offset; no random reshuffle.
  for(const c of terrain){const delta=heightAt(c.x,c.z,w)-c.h0;for(const m of c.meshes)m.position.y=m.userData.baseY+delta;c.top.material=materials[topTypeAt(c.x,c.z,w)];}
  lastW=w;
 }
 function floorAt(x,z){const gx=Math.round(x),gz=Math.round(z);if(is4){const h0=heightAt(gx,gz,0);return Math.round(h0)+1+(heightAt(gx,gz,w)-h0)}return heightAt(gx,gz,w)}
 function updatePlayer(dt){
  let mx=0,mz=0;if(keys.KeyA||keys.ArrowLeft)mx--;if(keys.KeyD||keys.ArrowRight)mx++;if(keys.KeyW||keys.ArrowUp)mz++;if(keys.KeyS||keys.ArrowDown)mz--;
  mx+=moveInput.x;mz+=-moveInput.z;const len=Math.hypot(mx,mz);if(len>1){mx/=len;mz/=len}
  const speed=5.1;const fx=Math.sin(player.yaw),fz=-Math.cos(player.yaw),rx=Math.cos(player.yaw),rz=Math.sin(player.yaw);
  const dx=(fx*mz+rx*mx)*speed*dt,dz=(fz*mz+rz*mx)*speed*dt;
  let nx=Math.max(-8.5,Math.min(8.5,player.x+dx)),nz=Math.max(-8.5,Math.min(8.5,player.z+dz));
  // Keep the player outside tree trunks while letting the terrain remain freely explorable.
  let treeHit=treeSpots.some(t=>Math.abs(nx-t.x)<.42&&Math.abs(nz-t.z)<.42&&player.y<t.y+2.5);
  if(!treeHit){player.x=nx;player.z=nz;}
  const floor=floorAt(player.x,player.z);
  if(jumpQueued&&player.ground){player.vy=6.6;player.ground=false;}jumpQueued=false;
  player.vy-=17*dt;player.y+=player.vy*dt;
  if(player.y<=floor){player.y=floor;player.vy=0;player.ground=true}else player.ground=false;
  camera.position.set(player.x,player.y+1.58,player.z);camera.rotation.x=player.pitch;camera.rotation.y=player.yaw;
 }
 function aimObject(){raycaster.setFromCamera(new THREE.Vector2(0,0),camera);const hit=raycaster.intersectObjects(Array.from(blocks.values()),false)[0];return hit||null}
 function mine3D(){const hit=aimObject();if(!hit){showToast('照準をブロックに合わせてね');return}const m=hit.object,b=m.userData.block;if(!b)return;scene.remove(m);blocks.delete(blockKey(b.x,b.y,b.z));adjustInv(b.type,1);}
 function place3D(){const hit=aimObject();if(!hit){showToast('置く面を照準で狙ってね');return}const normal=hit.face.normal.clone().transformDirection(hit.object.matrixWorld).round();const x=Math.round(hit.object.position.x+normal.x),y=hit.object.position.y+normal.y,z=Math.round(hit.object.position.z+normal.z);const type=blockTypes[selectedBlock].id;const occupied=Array.from(blocks.values()).some(m=>Math.abs(m.position.x-x)<.75&&Math.abs(m.position.y-y)<.75&&Math.abs(m.position.z-z)<.75);if(occupied){showToast('そこには置けないよ');return}if((inventory[type]||0)<=0){showToast('そのブロックを持っていないよ');return}addBlock(x,y,z,type);adjustInv(type,-1)}
 threeD={scene,camera,renderer,player,blocks,materials,terrain,treeSpots,cubeGeo,get w(){return w},set w(v){w=Math.max(-10,Math.min(10,v));},is4,update(dt){if(is4){if(wHeld)w=Math.max(-10,Math.min(10,w+wHeld*dt*1.6));updateTerrainW()}updatePlayer(dt);renderer.render(scene,camera);},resize(){const ww=viewport.clientWidth,hh=viewport.clientHeight;camera.aspect=ww/Math.max(1,hh);camera.updateProjectionMatrix();renderer.setSize(ww,hh)},mine:mine3D,place:place3D,look(dx,dy){player.yaw-=dx*.004;player.pitch=Math.max(-1.35,Math.min(1.35,player.pitch-dy*.004));},setW(v){w=Math.max(-10,Math.min(10,v));$('wSlider').value=w;$('wValue').textContent=`W = ${w.toFixed(2)}`;},getW(){return w;}};
 $('wSlider').value='0';$('wValue').textContent='W = 0.00';
}

function resizeCanvas(){if(mode!=='game')return;const dpr=Math.min(window.devicePixelRatio||1,2);const w=viewport.clientWidth,h=viewport.clientHeight;if(dimension<=2){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}else if(threeD)threeD.resize()}
window.addEventListener('resize',resizeCanvas);

function loop(t){if(mode!=='game')return;const dt=Math.min(.04,(t-(lastTime||t))/1000||0);lastTime=t;
 if(dimension===1){if(keys.ArrowLeft||keys.KeyA||keys.ArrowRight||keys.KeyD){if(t-oneD.lastStep>145){const dir=(keys.ArrowLeft||keys.KeyA)?-1:1;move1D(dir);oneD.lastStep=t;}}draw1D(viewport.clientWidth,viewport.clientHeight)}
 if(dimension===2){update2D(dt);draw2D(viewport.clientWidth,viewport.clientHeight)}
 if((dimension===3||dimension===4)&&threeD){threeD.update(dt);if(dimension===4){$('wValue').textContent=`W = ${threeD.getW().toFixed(2)}`;if(Math.abs(Number($('wSlider').value)-threeD.getW())>.02&&document.activeElement!==$('wSlider'))$('wSlider').value=threeD.getW();}}
 raf=requestAnimationFrame(loop);
}

// Keyboard controls
window.addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;
 if(e.code==='Space'&&dimension>=2)jumpQueued=true;
 if(dimension===4&&e.code==='KeyE'&&threeD)threeD.setW(threeD.getW()+.1);
 if(dimension===4&&e.code==='KeyQ'&&threeD)threeD.setW(threeD.getW()-.1);
 if(e.code==='Digit1')selectedBlock=0;if(e.code==='Digit2')selectedBlock=1;if(e.code==='Digit3')selectedBlock=2;if(e.code==='Digit4')selectedBlock=3;if(e.code==='Digit5')selectedBlock=4;renderHotbar();
 if(e.code==='KeyF'&&dimension===1)mine1D();
 if(e.code==='KeyF'&&dimension===2)mine2D();
 if(e.code==='KeyG'&&dimension===1)place1D();
 if(e.code==='KeyG'&&dimension===2)place2D();
 if(e.code==='KeyF'&&(dimension===3||dimension===4)&&threeD)threeD.mine();
 if(e.code==='KeyG'&&(dimension===3||dimension===4)&&threeD)threeD.place();
});
window.addEventListener('keyup',e=>{keys[e.code]=false});
window.addEventListener('blur',()=>{keys={};moveInput={x:0,z:0};wHeld=0});

// 1D/2D buttons
function bindHold(btn,down,up){const el=$(btn);el.addEventListener('pointerdown',e=>{e.preventDefault();down();el.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,e=>{up()}));}
bindHold('leftBtn',()=>{if(dimension===1)move1D(-1);else keys.TouchLeft=true},()=>{keys.TouchLeft=false});
bindHold('rightBtn',()=>{if(dimension===1)move1D(1);else keys.TouchRight=true},()=>{keys.TouchRight=false});
$('mineBtn').addEventListener('click',()=>dimension===1?mine1D():dimension===2?mine2D():null);
$('placeBtn').addEventListener('click',()=>dimension===1?place1D():dimension===2?place2D():null);
$('jumpBtn').addEventListener('pointerdown',e=>{e.preventDefault();jumpQueued=true});
$('mine3d').addEventListener('click',()=>threeD&&threeD.mine());$('place3d').addEventListener('click',()=>threeD&&threeD.place());$('jump3d').addEventListener('pointerdown',e=>{e.preventDefault();jumpQueued=true});

// 2D touch/click targeting
canvas.addEventListener('pointermove',e=>{if(dimension===2){const r=canvas.getBoundingClientRect();twoD.pointer={x:e.clientX-r.left,y:e.clientY-r.top,valid:true}}});
canvas.addEventListener('pointerleave',()=>{if(twoD)twoD.pointer.valid=false});
canvas.addEventListener('pointerdown',e=>{if(dimension!==2)return;const c=worldCellFromPointer(e);if(e.button===2||keys.ShiftLeft||keys.ShiftRight)place2DAt(c.x,c.y);else mine2DAt(c.x,c.y)});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

// Mobile 3D joystick and camera drag.
let joyPointer=null,touchLook=null;
movePad.addEventListener('pointerdown',e=>{e.preventDefault();joyPointer=e.pointerId;movePad.setPointerCapture(e.pointerId);updateJoy(e)});
movePad.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)updateJoy(e)});
function resetJoy(){joyPointer=null;moveInput={x:0,z:0};moveKnob.style.transform='translate(0,0)'}
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>movePad.addEventListener(ev,resetJoy));
function updateJoy(e){const r=movePad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width*.34,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max}moveInput.x=dx/max;moveInput.z=dy/max;moveKnob.style.transform=`translate(${dx}px,${dy}px)`;}
host.addEventListener('pointerdown',e=>{if(dimension<3)return;if(e.pointerType==='mouse'){if(!document.pointerLockElement)host.requestPointerLock?.();return;}touchLook={id:e.pointerId,x:e.clientX,y:e.clientY};host.setPointerCapture(e.pointerId)});
host.addEventListener('pointermove',e=>{if(!threeD)return;if(e.pointerType==='mouse')return;if(touchLook&&e.pointerId===touchLook.id){const dx=e.clientX-touchLook.x,dy=e.clientY-touchLook.y;touchLook.x=e.clientX;touchLook.y=e.clientY;threeD.look(dx,dy)}});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>host.addEventListener(ev,e=>{if(touchLook&&e.pointerId===touchLook.id)touchLook=null}));
document.addEventListener('mousemove',e=>{if(threeD&&document.pointerLockElement===host)threeD.look(e.movementX,e.movementY)});
host.addEventListener('click',e=>{if(e.pointerType==='mouse'&&threeD&&!document.pointerLockElement)threeD.mine()});
host.addEventListener('contextmenu',e=>{e.preventDefault();if(threeD)threeD.place()});

// Continuous fourth-axis controls: slider + press-and-hold buttons.
$('wSlider').addEventListener('input',e=>{if(threeD&&dimension===4)threeD.setW(Number(e.target.value))});
bindHold('wMinus',()=>{wHeld=-1},()=>{wHeld=0});bindHold('wPlus',()=>{wHeld=1},()=>{wHeld=0});

function disposeThree(){if(!threeD)return;try{if(document.pointerLockElement)document.exitPointerLock();threeD.renderer.dispose();threeD.cubeGeo.dispose();Object.values(threeD.materials).forEach(m=>m.dispose());threeD.scene.clear();}catch(e){}threeD=null;host.innerHTML='';host.style.display='none';}

// Keep the selected mode intact on reload; the selector always opens at the requested default 3D.
setScreen('menu');
})();
</script>
